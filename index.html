<style>

<header>

<div class="nav">

<main>

</div>

</main>

<section id="detail" class="detail">

<div class="detailBody">
<textarea id="foodText" placeholder="食べたものを入力してください。

例：
朝：ご飯1杯、納豆、味噌汁
昼：てりやきマックバーガーセット
夜：ご飯、焼き魚、野菜炒め

<script>

/* ==============================
   端末内保存（localStorage）
   ============================== */

const STORAGE_KEY="calorieData";

function loadLocalData(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    return saved?JSON.parse(saved):{};
  }catch(error){
    console.error("端末保存データの読み込みに失敗しました。",error);
    return {};
  }
}

function writeLocalData(data){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}


/* ==============================
   Gemini API
   Gemini 3.5 Flash-Lite
   ============================== */

const GEMINI_API_KEY="AQ.Ab8RN6I9b20eKy7jdynUY4rmKOH1GcImP2GfcxGGHUSj-o5m5Q";

const GEMINI_URL=
  "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent";


/* ==============================
   状態
   ============================== */

let current=new Date();
let selectedDate=null;
let currentResult=null;
let currentDetail="";
let monthData={};
let currentPreviewUrl="";


/* ==============================
   要素
   ============================== */

const calendar=document.getElementById("calendar");
const monthTitle=document.getElementById("monthTitle");
const detail=document.getElementById("detail");
const detailDate=document.getElementById("detailDate");
const foodText=document.getElementById("foodText");
const result=document.getElementById("result");
const cameraBtn=document.getElementById("cameraBtn");
const galleryBtn=document.getElementById("galleryBtn");
const cameraInput=document.getElementById("cameraInput");
const galleryInput=document.getElementById("galleryInput");
const imageStatus=document.getElementById("imageStatus");
const imagePreview=document.getElementById("imagePreview");


/* ==============================
   共通
   ============================== */

function monthKey(date){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}`;
}

function dateKey(date){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
}

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}


/* ==============================
   端末内データ読み込み
   ============================== */

function watchMonth(){

  const allData=loadLocalData();
  monthData=allData[monthKey(current)]||{};
  renderCalendar();

}


/* ==============================
   端末内データ保存
   ============================== */

async function saveDay(
  dateStr,
  text,
  kcal,
  detailText
){

  const allData=loadLocalData();
  const key=dateStr.substring(0,7);

  if(!allData[key]){
    allData[key]={};
  }

  allData[key][dateStr]={
    text:text,
    kcal:kcal,
    detail:detailText||"",
    updatedAt:new Date().toISOString()
  };

  writeLocalData(allData);

  if(key===monthKey(current)){
    monthData=allData[key];
    renderCalendar();
  }

}


/* ==============================
   カレンダー
   ============================== */

function renderCalendar(){

  const y=current.getFullYear();
  const m=current.getMonth();

  monthTitle.textContent=
    `${y}年${m+1}月`;

  calendar.innerHTML="";

  const firstDay=
    new Date(y,m,1).getDay();

  const lastDate=
    new Date(y,m+1,0).getDate();
    
  const todayStr=
    dateKey(new Date());

  for(let i=0;i<firstDay;i++){

    const empty=
      document.createElement("div");

    empty.className="day empty";

    calendar.appendChild(empty);

  }

  for(let d=1;d<=lastDate;d++){

    const dateStr=
      dateKey(new Date(y,m,d));

    const cell=
      document.createElement("div");

    cell.className="day";
    
    if(dateStr===todayStr){
      cell.classList.add("today");
    }

    const daynum=
      document.createElement("div");

    daynum.className="daynum";
    daynum.textContent=d;

    cell.appendChild(daynum);

    const saved=
      monthData[dateStr];

    if(
      saved &&
      Number.isFinite(Number(saved.kcal))
    ){

      const kcal=
        document.createElement("div");

      kcal.className="calorie";

      kcal.textContent=
        `${Number(saved.kcal)} kcal`;

      cell.appendChild(kcal);

    }

    cell.addEventListener(
      "click",
      ()=>openDay(dateStr)
    );

    calendar.appendChild(cell);

  }

}


/* ==============================
   日付画面
   ============================== */

function openDay(dateStr){

  selectedDate=dateStr;

  const [y,m,d]=
    dateStr.split("-").map(Number);

  detailDate.textContent=
    `${y}年${m}月${d}日`;

  const saved=
    monthData[dateStr];

  foodText.value=
    saved?.text||"";

  currentResult=
    saved?.kcal!=null
      ? Number(saved.kcal)
      : null;

  currentDetail=
    saved?.detail||"";

  clearImageDisplay();

  if(
    currentResult!==null &&
    Number.isFinite(currentResult)
  ){

    result.style.display="block";

    result.innerHTML=
      `<div class="total">
        合計：約 ${currentResult} kcal
      </div>
      <div class="detailText">
        ${escapeHtml(currentDetail)}
      </div>`;

  }else{

    result.style.display="none";
    result.innerHTML="";

  }

  detail.classList.add("active");

}


/* ==============================
   閉じる
   ============================== */

async function closeDay(){

  if(
    selectedDate &&
    foodText.value.trim()
  ){

    try{

      await saveDay(
        selectedDate,
        foodText.value,
        currentResult,
        currentDetail
      );

    }catch(error){

      alert(
        "端末への保存に失敗しました。\n\n"+
        error.message
      );

      return;

    }

  }

  detail.classList.remove("active");

}


/* ==============================
   料理写真の認識
   ============================== */

function clearImageDisplay(){

  if(currentPreviewUrl){
    URL.revokeObjectURL(currentPreviewUrl);
    currentPreviewUrl="";
  }

  imagePreview.style.display="none";
  imagePreview.innerHTML="";
  imageStatus.style.display="none";
  imageStatus.classList.remove("errorStatus");
  imageStatus.textContent="";
  cameraInput.value="";
  galleryInput.value="";

}

function showImageStatus(message,isError=false){

  imageStatus.style.display="block";
  imageStatus.classList.toggle("errorStatus",isError);
  imageStatus.textContent=message;

}

function setImageButtonsDisabled(disabled){

  cameraBtn.disabled=disabled;
  galleryBtn.disabled=disabled;

  cameraBtn.textContent=
    disabled?"認識中…":"写真を撮る";

  galleryBtn.textContent=
    disabled?"認識中…":"画像を選択";

}

function loadImage(file){

  return new Promise((resolve,reject)=>{

    const image=new Image();
    const objectUrl=URL.createObjectURL(file);

    image.onload=()=>{
      URL.revokeObjectURL(objectUrl);
      resolve(image);
    };

    image.onerror=()=>{
      URL.revokeObjectURL(objectUrl);
      reject(new Error("画像を読み込めませんでした。別の画像をお試しください。"));
    };

    image.src=objectUrl;

  });

}

async function prepareImageForGemini(file){

  if(!file||!file.type.startsWith("image/")){
    throw new Error("画像ファイルを選択してください。");
  }

  const image=await loadImage(file);
  const maxSide=1600;
  const scale=Math.min(1,maxSide/Math.max(image.naturalWidth,image.naturalHeight));
  const width=Math.max(1,Math.round(image.naturalWidth*scale));
  const height=Math.max(1,Math.round(image.naturalHeight*scale));
  const canvas=document.createElement("canvas");

  canvas.width=width;
  canvas.height=height;

  const context=canvas.getContext("2d");

  if(!context){
    throw new Error("このブラウザでは画像を処理できません。");
  }

  context.fillStyle="#ffffff";
  context.fillRect(0,0,width,height);
  context.drawImage(image,0,0,width,height);

  const dataUrl=canvas.toDataURL("image/jpeg",0.82);

  return {
    mimeType:"image/jpeg",
    data:dataUrl.split(",")[1]
  };

}

function parseImageAnswer(answer){

  const cleaned=answer
    .replace(/^```(?:json)?\s*/i,"")
    .replace(/\s*```$/i,"")
    .trim();

  const start=cleaned.indexOf("{");
  const end=cleaned.lastIndexOf("}");

  if(start<0||end<start){
    throw new Error("料理名とカロリーを読み取れませんでした。別の角度から撮影してください。");
  }

  const parsed=JSON.parse(cleaned.slice(start,end+1));
  const dishName=String(parsed.dishName||"").trim();
  const calories=Math.round(Number(parsed.calories));
  const details=String(parsed.details||"").trim();

  if(!dishName||!Number.isFinite(calories)||calories<0){
    throw new Error("料理名とカロリーを特定できませんでした。料理全体が写るように撮影してください。");
  }

  return {dishName,calories,details};

}

async function recognizeFoodImage(file){

  setImageButtonsDisabled(true);
  showImageStatus("画像から料理名とカロリーを認識しています…");

  if(currentPreviewUrl){
    URL.revokeObjectURL(currentPreviewUrl);
  }

  currentPreviewUrl=URL.createObjectURL(file);
  imagePreview.innerHTML=`<img src="${currentPreviewUrl}" alt="選択した料理の画像">`;
  imagePreview.style.display="block";

  try{

    const prepared=await prepareImageForGemini(file);

    const prompt=
`この画像に写っている料理を認識し、一般的な日本の食品成分表と標準的な1人前を基準にカロリーを推定してください。
複数の料理が写っている場合は、料理名を「、」でつないでdishNameにまとめ、画像内の全料理の合計カロリーをcaloriesに入れてください。
量、容器の大きさ、付け合わせ、調味料も可能な範囲で考慮してください。
detailsには、料理ごとの推定カロリーと合計の根拠を簡潔な日本語で書いてください。
画像から料理を判別できない場合は推測で断定せず、dishNameを空文字にしてください。
必ず次のJSON形式だけで回答してください。
{"dishName":"料理名","calories":650,"details":"料理名：約650 kcal"}`;

    const response=await fetch(
      GEMINI_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-goog-api-key":GEMINI_API_KEY
        },
        body:JSON.stringify({
          contents:[
            {
              parts:[
                {text:prompt},
                {
                  inlineData:{
                    mimeType:prepared.mimeType,
                    data:prepared.data
                  }
                }
              ]
            }
          ],
          generationConfig:{
            maxOutputTokens:450,
            responseMimeType:"application/json"
          }
        })
      }
    );

    if(!response.ok){

      const errorText=await response.text();

      if(response.status===429){
        throw new Error("AIの利用上限に達しています。少し時間を置いて再試行してください。");
      }

      throw new Error(`画像認識API HTTP ${response.status}\n${errorText}`);

    }

    const responseData=await response.json();
    const answer=responseData?.candidates?.[0]?.content?.parts
      ?.map(part=>part.text||"")
      .join("")||"";

    if(!answer){
      throw new Error("AIから画像認識結果が返りませんでした。");
    }

    const recognized=parseImageAnswer(answer);

    const previousText=foodText.value.trim();
    const previousDetail=currentDetail.trim();
    const explicitCalories=[
      ...previousText.matchAll(
        /(?:約\s*)?([\d,]+)\s*(?:kcal|キロカロリー)/gi
      )
    ].reduce(
      (sum,match)=>sum+Number(match[1].replace(/,/g,"")),
      0
    );
    const previousTotal=
      currentResult!==null&&Number.isFinite(Number(currentResult))
        ? Number(currentResult)
        : explicitCalories;
    const newEntry=
      `${recognized.dishName}　${recognized.calories} kcal`;
    const newDetail=recognized.details||
      `${recognized.dishName}：約 ${recognized.calories} kcal`;

    foodText.value=previousText
      ? `${previousText}\n${newEntry}`
      : newEntry;

    currentResult=Math.round(
      previousTotal+recognized.calories
    );

    currentDetail=[previousDetail,newDetail]
      .filter(Boolean)
      .join("\n");

    result.style.display="block";
    result.innerHTML=
      `<div class="total">
        合計：約 ${currentResult} kcal
      </div>
      <div class="detailText">
        ${escapeHtml(currentDetail)}
      </div>`;

    await saveDay(
      selectedDate,
      foodText.value,
      currentResult,
      currentDetail
    );

    showImageStatus("料理名とカロリーを入力し、この日のデータとして保存しました。");

  }catch(error){

    console.error(error);
    showImageStatus(
      "画像認識に失敗しました。\n"+(error.message||String(error)),
      true
    );

  }finally{

    setImageButtonsDisabled(false);
    cameraInput.value="";
    galleryInput.value="";

  }

}

function handleImageSelection(event){

  const file=event.target.files?.[0];

  if(file){
    recognizeFoodImage(file);
  }

}


/* ==============================
   Geminiカロリー計算
   ============================== */

async function calculateCalories(){

  const text=
    foodText.value.trim();

  if(!text){

    alert(
      "食べたものを入力してください。"
    );

    return;

  }

  const lines=text
    .split(/\r?\n/)
    .map(line=>line.trim())
    .filter(Boolean);

  const fixedLines=[];
  const uncalculatedLines=[];
  let fixedTotal=0;

  for(const line of lines){

    const matches=[
      ...line.matchAll(
        /(?:約\s*)?([\d,]+)\s*(?:kcal|キロカロリー)/gi
      )
    ];

    if(matches.length){

      fixedLines.push(line);
      fixedTotal+=matches.reduce(
        (sum,match)=>sum+Number(match[1].replace(/,/g,"")),
        0
      );

    }else{

      uncalculatedLines.push(line);

    }

  }

  const btn=
    document.getElementById("calcBtn");

  btn.disabled=true;
  btn.textContent="計算中…";

  result.style.display="block";
  result.innerHTML=
    "カロリーを計算しています…";

  if(!uncalculatedLines.length){

    currentResult=Math.round(fixedTotal);
    currentDetail=
      "入力済みのカロリーをそのまま合計しました。\n"+
      fixedLines.join("\n");

    result.innerHTML=
      `<div class="total">
        合計：約 ${currentResult} kcal
      </div>
      <div class="detailText">
        ${escapeHtml(currentDetail)}
      </div>`;

    try{

      await saveDay(
        selectedDate,
        text,
        currentResult,
        currentDetail
      );

    }catch(error){

      result.innerHTML=
        `<div class="error">
          保存に失敗しました。

          ${escapeHtml(error.message||String(error))}
        </div>`;

    }finally{

      btn.disabled=false;
      btn.textContent="カロリー計算";

    }

    return;

  }


  const prompt=
`以下の「未計算の食事内容」について、一般的な日本の食品成分表と標準的な1人前を基準に摂取カロリーを推定してください。
数量が書いてある場合はその数量を優先してください。
数量がない場合は一般的な1人前として推定してください。
アルコールも含めてください。
食品ごとの推定カロリーを簡潔に示してください。
最後に必ず「未記載分合計: 1234 kcal」の形式で、未計算の食事内容だけの合計を書いてください。
確定済みの食品は再計算せず、回答にも含めないでください。
医療上の厳密な栄養評価ではなく日常的な目安です。

確定済みカロリー：${fixedTotal} kcal
確定済みの食品：
${fixedLines.length?fixedLines.join("\n"):"なし"}

未計算の食事内容：
${uncalculatedLines.join("\n")}`;


  try{

    const response=
      await fetch(
        GEMINI_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "x-goog-api-key":GEMINI_API_KEY
          },

          body:JSON.stringify({
            contents:[
              {
                parts:[
                  {
                    text:prompt
                  }
                ]
              }
            ],

            generationConfig:{
              maxOutputTokens:700
            }
          })
        }
      );


    if(!response.ok){

      const errorText=
        await response.text();

      let message=
        `Gemini API HTTP ${response.status}\n\n${errorText}`;

      if(response.status===429){

        message=
          "Gemini APIの無料利用枠またはリクエスト上限に達しています。\n\n"+
          "少し時間を置いて再試行してください。\n"+
          "それでも続く場合は、Google AI Studioの使用量・請求設定を確認してください。\n\n"+
          errorText;

      }

      throw new Error(message);

    }


    const data=
      await response.json();


    const answer=
      data?.candidates?.[0]
        ?.content?.parts
        ?.map(
          part=>part.text||""
        )
        .join("")
      ||"";


    if(!answer){

      throw new Error(
        "Geminiから回答が返ってきませんでした。\n\n"+
        JSON.stringify(data,null,2)
      );

    }


    const match=
      answer.match(
        /未記載分合計\s*[:：]?\s*(?:約\s*)?([\d,]+)\s*(?:kcal|キロカロリー)/i
      );


    if(!match){

      throw new Error(
        "未計算分の合計カロリーを取得できませんでした。\n\n"+
        "Geminiの回答:\n"+
        answer
      );

    }


    currentResult=
      Math.round(
        fixedTotal+Number(
          match[1].replace(/,/g,"")
        )
      );

    currentDetail=
      fixedLines.length
        ? `確定済み（${fixedTotal} kcal）：\n${fixedLines.join("\n")}\n\n${answer}`
        : answer;


    result.innerHTML=
      `<div class="total">
        合計：約 ${currentResult} kcal
      </div>
      <div class="detailText">
        ${escapeHtml(currentDetail)}
      </div>`;


    await saveDay(
      selectedDate,
      text,
      currentResult,
      currentDetail
    );


  }catch(error){

    console.error(error);

    result.innerHTML=
      `<div class="error">
        カロリー計算に失敗しました。

        ${escapeHtml(
          error.message||String(error)
        )}
      </div>`;

  }finally{

    btn.disabled=false;
    btn.textContent="カロリー計算";

  }

}


/* ==============================
   月移動
   ============================== */

document
  .getElementById("todayBtn")
  .addEventListener(
    "click",
    ()=>{
      current=new Date();
      watchMonth();
    }
  );

document
  .getElementById("prevBtn")
  .addEventListener(
    "click",
    ()=>{
      current.setDate(1);
      current.setMonth(
        current.getMonth()-1
      );
      watchMonth();
    }
  );

document
  .getElementById("nextBtn")
  .addEventListener(
    "click",
    ()=>{
      current.setDate(1);
      current.setMonth(
        current.getMonth()+1
      );
      watchMonth();
    }
  );


/* ==============================
   ボタン
   ============================== */

cameraBtn.addEventListener(
  "click",
  ()=>{
    cameraInput.value="";
    cameraInput.click();
  }
);

galleryBtn.addEventListener(
  "click",
  ()=>{
    galleryInput.value="";
    galleryInput.click();
  }
);

cameraInput.addEventListener(
  "change",
  handleImageSelection
);

galleryInput.addEventListener(
  "change",
  handleImageSelection
);

document
  .getElementById("calcBtn")
  .addEventListener(
    "click",
    calculateCalories
  );

document
  .getElementById("closeBtn")
  .addEventListener(
    "click",
    closeDay
  );


/* ==============================
   起動
   ============================== */

watchMonth();

</script>
